name: Release

# Push a tag like v0.3.1 and this builds Windows binaries and publishes a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./build-windows.ps1
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File -Include *.exe,*.zip -Recurse |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: RustPlayer ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/RustPlayer-Setup-*.exe
            dist/RustPlayer-*-portable-win64.zip
            dist/SHA256SUMS.txt
